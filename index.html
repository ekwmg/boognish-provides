<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>The Altar of Boognish - Virtual Terminal Ritual</title>
<style>
/* Theme variables dynamically handled via body classes */
:root {
  --terminal-color: #00ff66;
  --terminal-glow: rgba(0, 255, 102, 0.4);
  --terminal-bg: #030803;
  --terminal-scanline: rgba(0, 255, 102, 0.03);
  --ascii-color: #00ff66;
}
body.theme-brown {
  --terminal-color: #b56b12;
  --terminal-glow: rgba(181, 107, 18, 0.4);
  --terminal-bg: #0d0600;
  --terminal-scanline: rgba(181, 107, 18, 0.04);
  --ascii-color: #d47a1c;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body, html {
  width: 100%;
  height: 100%;
  background-color: var(--terminal-bg);
  font-family: 'Courier New', Courier, monospace;
  color: var(--terminal-color);
  font-size: 19px; /* Base global font size for better legibility */
  overflow: hidden;
  position: relative;
  transition: background-color 0.5s ease, color 0.3s ease;
}
/* Interactive Audio Activation Splash Overlay */
#splash-screen {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-color: var(--terminal-bg);
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  font-size: 22px;
  letter-spacing: 2px;
  text-align: center;
  text-shadow: 0 0 5px var(--terminal-glow);
  transition: background-color 0.5s ease, color 0.3s ease;
  padding: 20px;
}
.splash-content {
  animation: pulse 2.5s infinite;
  padding: 20px;
  max-width: 600px;
  width: 100%;
}
.splash-sub {
  font-size: 16px;
  opacity: 0.6;
  display: block;
  margin-top: 15px;
}
.splash-terms {
  display: block;
  font-size: 13px;
  opacity: 0.5;
  margin-top: 30px;
  line-height: 1.4;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.splash-terms a {
  color: var(--terminal-color);
  text-decoration: underline;
}
@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
/* CRT Screen Effects */
body::before {
  content: " ";
  display: block;
  position: absolute;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
              linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
  z-index: 10;
  background-size: 100% 4px, 6px 100%;
  pointer-events: none;
}
body::after {
  content: " ";
  display: block;
  position: absolute;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(var(--terminal-scanline) 50%, transparent 50%);
  background-size: 100% 8px;
  z-index: 11;
  pointer-events: none;
  animation: scanline 15s linear infinite;
}
@keyframes scanline {
  0% { background-position: 0 0; }
  100% { background-position: 0 100%; }
}
.crt-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 12;
  pointer-events: none;
  animation: crt-flicker 0.25s infinite;
  box-shadow: inset 0 0 100px rgba(0,0,0,0.95);
}
@keyframes crt-flicker {
  0% { opacity: 0.96; }
  50% { opacity: 1; }
  100% { opacity: 0.95; }
}
/* Terminal Window Container - Fluid responsiveness */
.terminal-container {
  width: 100%;
  height: 100%;
  padding: 4vw; /* Adaptive scaling spacing framework */
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  position: relative;
  z-index: 1;
  text-shadow: 0 0 5px var(--terminal-glow);
}
@media (min-width: 768px) {
  .terminal-container {
    padding: 25px;
  }
}
.terminal-screen {
  flex-grow: 1;
  overflow-y: auto;
  margin-bottom: 20px;
  padding-right: 10px;
  text-align: left !important; /* Force baseline display engine layout left */
}
/* Scrollbar Styling */
.terminal-screen::-webkit-scrollbar {
  width: 8px;
}
.terminal-screen::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.5);
}
.terminal-screen::-webkit-scrollbar-thumb {
  background: var(--terminal-color);
  border-radius: 4px;
}
/* Output typography */
.line {
  line-height: 1.4;
  margin-bottom: 8px;
  white-space: pre-wrap;
  word-wrap: break-word;
  text-align: left !important;
}
/* Flex alignment wrapper to enforce perfect alignment columns */
.help-row {
  display: flex;
  align-items: flex-start;
  flex-wrap: wrap;
  line-height: 1.4;
  margin-bottom: 6px;
}
.help-cmd {
  display: inline-block;
  width: 180px;
  flex-shrink: 0;
  font-weight: bold;
}
.help-desc {
  flex-grow: 1;
}
.system-alert {
  color: #ff3300;
  text-shadow: 0 0 6px rgba(255, 51, 0, 0.6);
}
.success-text {
  color: #ffaa00;
  text-shadow: 0 0 6px rgba(255, 170, 0, 0.6);
}
/* Reward box is inline, fitting perfectly into text scroll streams */
.reward-box {
  border: 2px dashed var(--terminal-color) !important;
  padding: 24px !important;
  margin: 20px 0 !important;
  background: rgba(0, 0, 0, 0.4) !important;
  display: block !important;
  text-align: left !important;
  width: 100% !important;
  max-width: 750px !important;
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.5) !important;
}
.reward-content-wrapper {
  text-align: left !important;
  width: 100% !important;
  display: block !important;
}
.reward-box h2 {
  font-size: 24px !important;
  text-align: left !important;
  margin: 0 0 16px 0 !important;
  display: block !important;
  width: 100% !important;
}
.reward-box p {
  font-size: 20px !important;
  line-height: 1.5 !important;
  margin: 0 0 14px 0 !important;
  text-align: left !important;
  display: block !important;
  width: 100% !important;
}
.reward-link {
  color: #000000 !important;
  background: var(--terminal-color) !important;
  padding: 10px 20px !important;
  text-decoration: none !important;
  display: block !important; /* Converts link to clean layout block */
  max-width: 320px !important;
  margin: 0 0 12px 0 !important;
  font-weight: bold !important;
  font-size: 18px !important;
  text-shadow: none !important;
  text-align: center !important; /* Center-align link text inside the box button itself */
  transition: opacity 0.15s ease !important;
  cursor: pointer !important;
}
.reward-link:hover {
  background: #ffffff !important;
  color: #000000 !important;
  opacity: 0.95 !important;
}
.lockout-msg-container {
  margin-top: 25px !important;
  display: block !important;
  width: 100% !important;
  text-align: left !important;
}
/* Input Bar */
.input-container {
  display: flex;
  align-items: center;
  border-top: 1px solid rgba(0, 255, 102, 0.2);
  padding-top: 15px;
  text-align: left !important;
}
body.theme-brown .input-container {
  border-top: 1px solid rgba(181, 107, 18, 0.2);
}
.prompt {
  font-weight: bold;
  margin-right: 10px;
  white-space: nowrap;
  letter-spacing: 1px;
  text-align: left !important;
}
.input-wrapper {
  flex-grow: 1;
  position: relative;
  display: flex;
  align-items: center;
  text-align: left !important;
}
#terminal-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: transparent;
  caret-color: transparent;
  font-family: 'Courier New', Courier, monospace;
  font-size: 19px;
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  z-index: 2;
  text-align: left !important;
}
#visual-input-render {
  font-size: 19px;
  color: var(--terminal-color);
  white-space: pre-wrap;
  pointer-events: none;
  z-index: 1;
  display: flex;
  align-items: center;
  width: 100%;
  text-align: left !important;
}
.cursor {
  display: inline-block;
  width: 11px;
  height: 22px;
  background-color: var(--terminal-color);
  box-shadow: 0 0 5px var(--terminal-color);
  animation: blink 0.8s infinite;
  margin-left: 1px;
}
@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.ascii-container {
  display: inline-block;
  text-align: left;
  margin: 15px 0;
  max-width: 100%;
  overflow-x: auto;
}
.ascii-art {
  font-family: monospace;
  white-space: pre;
  line-height: 1.1;
  color: var(--ascii-color);
}
.ascii-caption {
  text-align: center;
  font-weight: bold;
  letter-spacing: 3px;
  margin-top: 8px;
  font-size: 18px;
}
/* Mobile Specific Responsive Hierarchy Engine */
@media (max-width: 768px) {
  body, html, #terminal-input, #visual-input-render {
    font-size: 15px; /* De-clutter text scales across mid-size displays */
  }
  .line {
    margin-bottom: 5px;
    line-height: 1.35;
  }
  .help-cmd {
    width: 140px;
  }
  /* Highly condensed layout specs for reward components to fit on one viewport screen */
  .reward-box {
    padding: 14px !important;
    margin: 10px 0 !important;
    border-width: 1.5px !important;
  }
  .reward-box h2 {
    font-size: 18px !important;
    margin-bottom: 8px !important;
  }
  .reward-box p {
    font-size: 14px !important;
    margin-bottom: 8px !important;
    line-height: 1.4 !important;
  }
  .reward-link {
    padding: 8px 12px !important;
    font-size: 14px !important;
    margin-bottom: 6px !important;
    max-width: 100% !important;
    text-align: center !important;
  }
  .lockout-msg-container {
    margin-top: 12px !important;
  }
  .lockout-msg-container p {
    font-size: 13px !important;
    padding: 6px !important;
    border-width: 1px !important;
  }
}
@media (max-width: 480px) {
  body, html, #terminal-input, #visual-input-render {
    font-size: 13px; /* Maximum compression factor for standard hand-held dimensions */
  }
  .line {
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .help-cmd {
    width: 100%;
    margin-bottom: 2px;
  }
  .cursor {
    width: 8px;
    height: 15px;
  }
  .ascii-art {
    font-size: 8px !important; /* Scale down rows dynamically to protect mono column flow alignment */
    line-height: 1.0 !important;
  }
  .ascii-caption {
    font-size: 13px;
    letter-spacing: 1px;
  }
}
</style>

<script>
// --- Sound Synth Engine (Native Web Audio API) ---
let audioEnabled = true;
let audioCtx = null;
let bgOsc1 = null;
let bgOsc2 = null;
let bgGain = null;

// Vallejo Tab Loop State Variables
let vallejoIntervalId = null;
const vallejoBPM = 170;
const eighthNoteDuration = 60 / vallejoBPM / 2; // Eighth note duration in seconds (~0.176s)

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, type, duration, volume = 0.1) {
  if (!audioEnabled) return;
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// Custom Polyphonic Synth Function to cleanly play the Open E-Minor Chord Stab Tab Architecture
function playEMinorChordStab(volume = 0.08) {
  if (!audioEnabled) return;
  try {
    initAudio();
    const chordFrequencies = [82.41, 110.00, 164.81, 196.00, 246.94, 329.63];
    const now = audioCtx.currentTime;
    const strumDuration = 0.18; // Short, punchy down-stroke strum layout
    
    chordFrequencies.forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = index < 2 ? 'sawtooth' : 'triangle';
      osc.frequency.value = freq;
      
      const stringDelay = index * 0.006;
      gain.gain.setValueAtTime(0.001, now + stringDelay);
      gain.gain.exponentialRampToValueAtTime(volume / chordFrequencies.length, now + stringDelay + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.00001, now + stringDelay + strumDuration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + stringDelay);
      osc.stop(now + stringDelay + strumDuration);
    });
  } catch(e) {}
}

function startVallejoMelodyLoop() {
  if (vallejoIntervalId) return;
  stopBackgroundDrone(); 
  let beatStep = 0;
  vallejoIntervalId = setInterval(() => {
    if (beatStep % 2 === 0) {
      playEMinorChordStab(0.12);
    }
    beatStep = (beatStep + 1) % 8;
  }, eighthNoteDuration * 1000);
}

function stopVallejoMelodyLoop() {
  if (vallejoIntervalId) {
    clearInterval(vallejoIntervalId);
    vallejoIntervalId = null;
  }
}

function startBackgroundDrone() {
  if (!audioEnabled || bgOsc1 || vallejoIntervalId) return; 
  try {
    initAudio();
    bgOsc1 = audioCtx.createOscillator();
    bgOsc2 = audioCtx.createOscillator();
    bgGain = audioCtx.createGain();
    
    bgOsc1.type = 'sawtooth';
    bgOsc1.frequency.value = 55; 
    bgOsc2.type = 'sawtooth';
    bgOsc2.frequency.value = 55.4; 
    
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 100; 
    
    bgGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    
    bgOsc1.connect(filter);
    bgOsc2.connect(filter);
    filter.connect(bgGain);
    bgGain.connect(audioCtx.destination);
    
    bgOsc1.start();
    bgOsc2.start();
  } catch(e) {}
}

function stopBackgroundDrone() {
  try {
    if (bgOsc1) { bgOsc1.stop(); bgOsc1.disconnect(); }
    if (bgOsc2) { bgOsc2.stop(); bgOsc2.disconnect(); }
  } catch(e) {}
  bgOsc1 = null;
  bgOsc2 = null;
}

function playKeySound() {
  playTone(180 + Math.random() * 200, 'triangle', 0.05, 0.04);
}

function simulateLoading(steps, callback) {
  let i = 0;
  terminalInput.disabled = true;
  function nextStep() {
    if (i < steps.length) {
      writeLine(steps[i].text, steps[i].class || '');
      if (steps[i].sound === 'beep') playTone(90, 'sawtooth', 0.08, 0.05);
      i++;
      setTimeout(nextStep, Math.random() * 300 + 150);
    } else {
      terminalInput.disabled = false;
      terminalInput.focus();
      if (callback) callback();
    }
  }
  nextStep();
}

    playReturnSound();
    const cmd = terminalInput.value;
    executeCommand(cmd);
    terminalInput.value = '';
    inputRenderChars.textContent = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (commandHistory.length > 0 && historyIndex > 0) {
      historyIndex--;
      terminalInput.value = commandHistory[historyIndex];
      inputRenderChars.textContent = commandHistory[historyIndex];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      terminalInput.value = commandHistory[historyIndex];
      inputRenderChars.textContent = commandHistory[historyIndex];
    } else {
      historyIndex = commandHistory.length;
      terminalInput.value = '';
      inputRenderChars.textContent = '';

  }
});
